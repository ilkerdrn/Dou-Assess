# Host NGINX example. TLS certificates/paths are institution-managed.
server {
    listen 80;
    server_name assess.dogus.edu.tr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name assess.dogus.edu.tr;
    ssl_certificate     /etc/letsencrypt/live/assess.dogus.edu.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assess.dogus.edu.tr/privkey.pem;
    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
}
