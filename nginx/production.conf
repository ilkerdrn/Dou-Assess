limit_req_zone $binary_remote_addr zone=dou_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=dou_upload:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=dou_conn:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 64m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 120s;
    large_client_header_buffers 4 16k;

    limit_conn dou_conn 20;
    limit_conn_status 429;
    limit_req_status 429;

    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    location ~ ^/api/(import/|integrations/obs/workbook/|exams/[0-9]+/(scans|scans-batch|evidence)) {
        limit_req zone=dou_upload burst=10 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
    }

    location / {
        limit_req zone=dou_api burst=60 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
