name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.lock

      - name: Run backend test suite (SQLite)
        run: python -m pytest tests/ -q

  e2e-tests:
    # Playwright 1.57 does not yet support Ubuntu 26.04, which ubuntu-latest now
    # resolves to; pin to the LTS version it officially supports.
    runs-on: ubuntu-24.04
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.lock

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: python -m pytest e2e/ -q
